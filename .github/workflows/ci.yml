name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      # The runner's system Python is externally managed, so install into a uv venv and put it
      # on PATH. This also keeps CI on the same Python 3.11 the project pins locally.
      - name: Create the environment
        run: |
          uv venv --python 3.11
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install the package
        run: uv pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check lfpaudit tests

      - name: Unit tests
        # The suite is synthetic-only by construction; nothing here reaches the network.
        run: pytest -q -m "not slow"

      - name: End-to-end smoke run
        run: lfpaudit smoke --device cpu
