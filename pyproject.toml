[project]
name = "lfpaudit"
version = "0.1.0"
description = "Reproduction, calibration and interpretability audit of LFP2Vec (NeurIPS 2025) on public Neuropixels LFP"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Keshav Rajput" }]
dependencies = [
    "numpy>=1.26,<2.2",
    "scipy>=1.11",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
    "torch>=2.4",
    "transformers>=4.44",
    "h5py>=3.10",
    "pyyaml>=6.0",
    "typer>=0.12",
    "tqdm>=4.66",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
ibl = ["ONE-api>=2.7", "ibllib>=2.26", "ibl-neuropixel>=1.0"]
allen = ["pynwb>=2.8", "fsspec>=2024.6", "aiohttp>=3.9", "requests>=2.31"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "pre-commit>=3.7"]

[project.scripts]
lfpaudit = "lfpaudit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lfpaudit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: touches real data or downloads; excluded from CI",
]
filterwarnings = [
    "error::DeprecationWarning",
    # Apple's Accelerate BLAS raises spurious IEEE exception flags during a perfectly finite
    # matmul on arm64, which NumPy surfaces as RuntimeWarnings. Verified harmless: a plain
    # `A @ B` on finite random matrices triggers all four. See docs/LAB_NOTEBOOK.md.
    "ignore:(divide by zero|overflow|underflow|invalid value) encountered in matmul:RuntimeWarning",
]
